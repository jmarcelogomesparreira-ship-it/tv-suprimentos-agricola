<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Suprimentos Agrícola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#E6E9DD; --card:#FFFFFF;
  --or:#FF7500; --or2:#FF9E1B; --orc:#FF8200;
  --neu:#CDD2BA; --g1:#00B74F; --g2:#00843D; --g3:#154734;
  --red:#D7261E; --ink:#1D2417; --mut:#5B6448;
  --font:'DIN','DIN Pro','Barlow Condensed','Barlow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink)}
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;
  display:grid;grid-template-columns:120px 1fr;grid-template-rows:110px 1fr 96px;background:var(--bg)}

/* CABEÇALHO */
header{grid-column:1/3;display:grid;grid-template-columns:120px minmax(0,1fr) auto;background:#fff;box-shadow:0 4px 14px rgba(21,71,52,.08);z-index:2}
.hicon{background:var(--or);display:flex;align-items:center;justify-content:center;color:#fff}
.hicon svg{width:62px;height:62px}
.htitle{display:flex;align-items:center;gap:22px;padding-left:30px;min-width:0}
.htitle h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:42px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.tag{white-space:nowrap;flex:none;font-size:18px;font-weight:700;letter-spacing:.08em;color:var(--or);border:2px solid var(--or);border-radius:30px;padding:4px 14px}
.hright{display:flex;align-items:center;gap:30px;padding-right:36px}
.pill{display:flex;align-items:center;background:var(--g3);border-radius:40px;overflow:hidden;font-weight:700}
.pill span:first-child{background:var(--g2);color:#fff;padding:10px 18px;font-size:18px;letter-spacing:.06em;border-radius:40px}
.pill span:last-child{color:#fff;padding:10px 22px 10px 16px;font-size:24px}
.clock{text-align:right;line-height:1}
.clock b{display:block;font-size:56px;font-weight:700;color:var(--g3);font-variant-numeric:tabular-nums}
.clock small{font-size:20px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}

/* MENU */
aside{background:var(--neu);display:flex;flex-direction:column;padding-top:4px;overflow:hidden;min-height:0}
.mi{height:86px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--or);transition:background .3s}
.mi svg{width:36px;height:36px}
.mi span{font-size:13px;font-weight:700;color:#000;text-transform:uppercase;letter-spacing:0;text-align:center;line-height:1.05}
.mi.on{background:#fff}

/* TELAS */
main{position:relative;padding:28px}
.screen{position:absolute;inset:28px;display:grid;gap:24px;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s}
.screen.on{opacity:1;visibility:visible}
.screen>*{min-width:0}
.card{background:var(--card);border-radius:20px;padding:24px 28px;display:flex;flex-direction:column;min-height:0;box-shadow:0 2px 10px rgba(21,71,52,.05)}
.ct{font-size:26px;font-weight:700;letter-spacing:.04em;color:var(--g3);text-transform:uppercase;text-align:center;margin-bottom:10px}
.cw{position:relative;flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:24px;min-height:0}
.col>.card{flex:1}

/* KPI */
.kpi{position:relative;padding:24px 30px 22px 46px;justify-content:space-between}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:16px;border-radius:20px 0 0 20px;background:var(--neu)}
.s-ok::before{background:var(--g1)} .s-at::before{background:var(--or2)} .s-cr::before{background:var(--red)}
.kl{font-size:27px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--mut);line-height:1.1}
.kv{font-size:118px;font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.kv small{font-size:.42em;font-weight:700;margin-left:6px;color:var(--mut)}
.s-cr .kv{color:var(--red)}
.kf{display:flex;align-items:center;justify-content:space-between;gap:12px}
.meta{font-size:24px;font-weight:600;color:var(--mut)}
.chip{font-size:20px;font-weight:700;letter-spacing:.06em;padding:6px 16px;border-radius:30px;color:#fff}
.s-ok .chip{background:var(--g2)} .s-at .chip{background:var(--or2);color:var(--ink)} .s-cr .chip{background:var(--red)}
.ks{font-size:22px;font-weight:600;color:var(--mut);margin-top:4px}
.kpi.sm .kv{font-size:92px}

/* LISTAS GRANDES */
.rows{display:flex;flex-direction:column;justify-content:space-around;flex:1}
.ar{display:grid;grid-template-columns:120px 1fr;gap:22px;align-items:center}
.badge{height:84px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:#fff}
.badge small{font-size:22px;margin-left:3px}
.ar b{display:block;font-size:32px;font-weight:700;line-height:1.05}
.ar span{font-size:24px;font-weight:600;color:var(--mut)}
.pr{display:grid;grid-template-columns:1fr 130px;gap:6px 22px;align-items:center}
.pr .nm{font-size:28px;font-weight:700}
.pr .nm em{font-style:normal;font-weight:600;color:var(--mut);font-size:22px;margin-left:10px}
.pr .pc{grid-row:1/3;grid-column:2;font-size:52px;font-weight:700;text-align:right}
.track{height:28px;border-radius:14px;background:var(--bg);overflow:hidden}
.fill{height:100%;border-radius:14px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.leg{display:flex;gap:28px;justify-content:center;font-size:22px;font-weight:700;color:var(--mut);text-transform:uppercase;margin-bottom:6px}
.leg i{display:inline-block;width:18px;height:18px;border-radius:50%;margin-right:8px;vertical-align:-2px}
.dleg{display:flex;flex-direction:column;justify-content:center;gap:14px;font-size:24px;font-weight:700}
.dleg div{display:flex;align-items:center;gap:12px}
.dleg i{width:22px;height:22px;border-radius:6px;flex:none}
.dleg span{margin-left:auto;color:var(--mut)}
.big{font-size:150px;font-weight:700;line-height:1;text-align:center}
.bigsub{font-size:28px;font-weight:700;color:var(--mut);text-align:center;text-transform:uppercase}
.bars2{display:flex;flex-direction:column;gap:26px;margin-top:20px}
.bars2 label{display:flex;justify-content:space-between;font-size:26px;font-weight:700;margin-bottom:8px;text-transform:uppercase}

/* SPARKLINES E MERCADO */
.spark{position:relative;height:78px;margin:4px -6px 2px}
.mk{padding:20px 22px 18px;gap:4px}
.mh{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.mn{font-size:25px;font-weight:700;text-transform:uppercase;color:var(--g3);line-height:1.05}
.src{font-size:14px;font-weight:700;letter-spacing:.05em;color:var(--mut);background:var(--bg);border-radius:20px;padding:4px 10px;white-space:nowrap}
.src.live{background:var(--g2);color:#fff;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.mv{font-size:56px;font-weight:700;line-height:1;margin-top:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mv small{font-size:.42em;color:var(--mut);margin-left:4px}
.mx{font-size:24px;font-weight:700}
.mk .spark{flex:1;height:auto;min-height:90px}
.imp{font-size:19px;font-weight:600;color:var(--mut);line-height:1.15;border-top:2px solid var(--bg);padding-top:8px}
.tt i{font-style:normal;color:var(--neu);margin-right:6px}

/* RELAÇÃO DE FORNECEDORES */
.sch,.scr{display:grid;grid-template-columns:60px minmax(0,1.45fr) 1.15fr 1fr .8fr .85fr 130px;gap:22px;align-items:center}
.sch{font-size:18px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding:2px 0 10px;border-bottom:3px solid var(--bg)}
.scr{flex:1;border-bottom:2px solid var(--bg)} .scr:last-child{border-bottom:0}
.rk{width:56px;height:56px;border-radius:14px;background:var(--or);color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center}
.fn{min-width:0} .fn b{display:block;font-size:31px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn span{font-size:20px;color:var(--mut);font-weight:600}
.vv{font-size:40px;font-weight:700;line-height:1;white-space:nowrap} .vv small{font-size:.5em;color:var(--mut);margin-left:4px}
.vs{font-size:18px;font-weight:600;color:var(--mut);margin-top:5px;white-space:nowrap}
.minibar{height:12px;border-radius:6px;background:var(--bg);margin-top:8px;overflow:hidden} .minibar div{height:100%;border-radius:6px;background:var(--or)}
.nota{width:96px;height:96px;border-radius:50%;border:10px solid;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;justify-self:center}
.kpi.xs{padding:18px 24px 16px 40px} .kpi.xs .kv{font-size:76px} .kpi.xs .kl{font-size:22px} .kpi.xs .meta{font-size:20px} .kpi.xs .chip{font-size:16px;padding:4px 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:24px;min-height:0}

/* RODAPÉ */
footer{grid-column:1/3;display:grid;grid-template-rows:6px 54px 36px;background:var(--g3)}
.prog{background:rgba(255,255,255,.12)}
.prog div{height:100%;background:var(--or);transform-origin:left;transform:scaleX(0)}
.ticker{display:flex;overflow:hidden}
.tl{background:var(--or);color:#fff;font-size:24px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:10px;padding:0 26px;flex:none;z-index:1}
.tl svg{width:28px;height:28px}
.tw{flex:1;overflow:hidden;position:relative}
.tt{position:absolute;white-space:nowrap;top:50%;transform:translateY(-50%);font-size:27px;font-weight:600;color:#fff;animation:roll linear infinite}
.tt b{color:var(--or2);margin:0 26px}
@keyframes roll{from{left:100%}to{left:0;transform:translate(-100%,-50%)}}
.cred{display:flex;justify-content:space-between;align-items:center;padding:0 26px;background:#0f3527;color:rgba(255,255,255,.75);font-size:18px;font-weight:600;letter-spacing:.03em}
.cred b{color:#fff}
#pz{display:none;color:var(--or2);font-weight:700}
body.paused #pz{display:inline}
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="hicon" id="hicon"></div>

      <div class="pill"><span>DADOS ATUALIZADOS EM</span><span id="upd"></span></div>
      <div class="clock"><b id="hora">--:--</b><small id="data"></small></div>
    </div>
  </header>
  <aside id="menu"></aside>
  <main id="main"></main>
  <footer>
    <div class="prog"><div id="bar"></div></div>

      <div class="tw"><div class="tt" id="tt"></div></div>
    </div>
    <div class="cred"><span>Desenvolvido por <b>Marcelo José Gomes Parreira</b> · Suprimentos Agrícola · Unidade Iturama · <b style="color:var(--or2)">PROTÓTIPO COM DADOS FICTÍCIOS</b></span><span><span id="pz">⏸ PAUSADO · </span>← → navegar · ESPAÇO pausa · F tela cheia</span></div>
  </footer>
</div>

<script>
/* =========================================================
   DADOS (fictícios) — trocar pelos exports do SAP depois
   ========================================================= */
const D = {
  atualizado: '16/10/2026 07:30',
  resumo:   {rcAbertas:184, rcAntigas:37, atrasadasPct:11.2, otif:87.4, lead:5.6, saving:1.27, contrato:58, emerg:7.8},

  idadeMedia: 9.4,
  pedidos: {abertos:412, valor:18.4, atrasados:46, valorAtras:2.1, semana:128},
  entregas: {labels:['HOJE','SÁB 17','DOM 18','SEG 19','TER 20','QUA 21','QUI 22'], v:[22,6,2,31,27,21,19]},
  atrasos: [
    {f:'FERTIMINAS',m:'Cloreto de potássio',d:12},

  gasto: {labels:['FERTIMINAS','DIESEL CERRADO','AGROSUL INSUMOS','QUÍMICA PARANAÍBA','TRATORPEÇAS LTDA','OUTROS'], v:[18,16,12,9,7,38]},
  contratos: {v30:4, v60:7, v90:12, contrato:58, spot:42, lista:[
    {n:'Diesel S10',f:'Diesel Cerrado',p:94,venc:'28/10'},
    {n:'Fertilizantes NPK',f:'Fertiminas',p:88,venc:'15/11'},
    {n:'Peças de colhedora',f:'Tratorpeças',p:76,venc:'02/12'},
    {n:'Defensivos',f:'Química Paranaíba',p:61,venc:'20/01'},
    {n:'Pneus agrícolas',f:'Borrachas IT',p:43,venc:'10/03'}
  ]},
  estoque: {abaixoPP:23, itens:[['DIESEL S10',4],['FACA DE CORTE COLHEDORA',6],['FIPRONIL',9],['UREIA',12],['ÓLEO HIDRÁULICO',15],['PNEU 23.1-26',18],['GLIFOSATO',21],['CLORETO DE POTÁSSIO',28]]},
  orcamento: {labels:[['TRATOS','CULTURAIS'],['COLHEITA','MECAN.'],'CCT',['FORMAÇÃO','LAVOURA'],['MANUT.','FROTA'],'IRRIGAÇÃO'],
              orc:[12.4,9.8,7.6,6.1,4.9,2.2], real:[10.1,8.3,6.4,4.2,4.6,1.5], periodo:75},
  /* FORNECEDORES — safra atual (R$ milhões). lt = prazo médio real de entrega (dias), prom = prazo prometido,
     otif = % entregue no prazo e completo, div = % de entregas com divergência (quantidade, material, NF, avaria) */
  fornecedores: [
    {n:'FERTIMINAS',          cat:'Fertilizantes',         g:17.3, lt:24, prom:15, otif:72.8, div:6.1},
    {n:'DIESEL CERRADO',      cat:'Combustíveis',          g:15.4, lt:2,  prom:2,  otif:96.1, div:0.4},
    {n:'AGROSUL INSUMOS',     cat:'Defensivos',            g:11.5, lt:8,  prom:10, otif:97.8, div:1.2},
    {n:'QUÍMICA PARANAÍBA',   cat:'Defensivos',            g:8.6,  lt:12, prom:10, otif:90.6, div:2.8},
    {n:'TRATORPEÇAS LTDA',    cat:'Peças de colhedora',    g:6.7,  lt:18, prom:7,  otif:79.3, div:5.4},
    {n:'SEMENTES VALE',       cat:'Mudas e sementes',      g:5.8,  lt:9,  prom:10, otif:93.4, div:1.9},
    {n:'HIDRÁULICA TRIÂNGULO',cat:'Mangueiras e conexões', g:4.6,  lt:11, prom:8,  otif:87.2, div:3.3},

  outros: {g:16.8, qtd:148},          // demais fornecedores ativos

  ocorrencias: {labels:['ATRASO','QUANTIDADE DIVERGENTE','NOTA FISCAL DIVERGENTE','MATERIAL ERRADO','AVARIA / EMBALAGEM'], v:[46,17,14,9,6]},
  metaLead: 10, metaDiv: 3,
  /* histórico mensal (abr → out) para as linhas da visão geral */
  hist: {
    rcAbertas:[150,158,171,149,166,162,184], rcAntigas:[18,22,25,19,31,29,37],
    atrasadasPct:[7.2,8.1,9.4,8.8,10.1,9.6,11.2], otif:[90.2,91.5,88.7,86.9,89.8,89.1,87.4],
    lead:[6.4,6.0,6.3,5.9,6.2,6.1,5.6], saving:[0.82,1.05,0.91,1.12,0.88,0.94,1.27],
    contrato:[49,51,53,52,54,55,58], emerg:[12.1,11.4,10.2,9.8,10.5,9.2,7.8]
  },

     live = buscado automaticamente na internet. bom = direção boa para a usina.

    {k:'selic', n:'Selic',               pre:'',    suf:'% a.a.',d:2, v:14.25,vol:0,    bom:'baixa', live:true,  fonte:'Banco Central', per:'12 meses', pp:true, imp:'Custo do dinheiro e prazo de pagamento'},

    {k:'igpm',  n:'IGP-M 12 meses',      pre:'',    suf:'%',     d:2, v:3.20, vol:.04,  bom:'baixa', live:true,  fonte:'Banco Central', per:'9 meses', pp:true, imp:'Reajuste de contratos e locações'},
    {k:'brent', n:'Petróleo Brent',      pre:'US$ ',suf:'/bbl',  d:2, v:68.40,vol:.012, bom:'baixa', live:false, fonte:'ICE', per:'30 dias', imp:'Base do preço do diesel e do frete'},
    {k:'diesel',n:'Diesel S10',          pre:'R$ ', suf:'/L',    d:2, v:6.05, vol:.003, bom:'baixa', live:false, fonte:'ANP', per:'30 dias', imp:'Frota agrícola, CCT e colheita'},

    {k:'acucar',n:'Açúcar cristal',      pre:'R$ ', suf:'/sc',   d:2, v:120.5,vol:.008, bom:'alta',  live:false, fonte:'Cepea', per:'30 dias', imp:'Receita da usina · saca de 50 kg'},
    {k:'etanol',n:'Etanol hidratado',    pre:'R$ ', suf:'/L',    d:2, v:2.85, vol:.01,  bom:'alta',  live:false, fonte:'Cepea', per:'30 dias', imp:'Receita da usina · usinas de SP'}

/* ========================================================= */
const C = {or:'#FF7500',or2:'#FF9E1B',neu:'#CDD2BA',g1:'#00B74F',g2:'#00843D',g3:'#154734',red:'#D7261E',ink:'#1D2417',mut:'#5B6448'};
const FONT = "'Barlow Condensed','DIN',sans-serif";
const LBL = {ok:'NO ALVO',at:'ATENÇÃO',cr:'CRÍTICO'};
const SC = {ok:C.g1,at:C.or2,cr:C.red};
const params = new URLSearchParams(location.search);
const DUR = (+params.get('t') || 15) * 1000;

const fmtN = (v,d=0) => v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
function st(v,meta,dir,tol=.12){ // dir 'min' = quanto maior melhor; 'max' = quanto menor melhor
  const good = dir==='min' ? v>=meta : v<=meta;
  if(good) return 'ok';
  const gap = dir==='min' ? (meta-v)/meta : (v-meta)/meta;
  return gap <= tol ? 'at' : 'cr';
}
const covSt = d => d<7?'cr':d<15?'at':'ok';
const pctSt = p => p>=90?'cr':p>=75?'at':'ok';

function num(v,d=0,pre='',suf=''){
  return `<span class="num" data-v="${v}" data-d="${d}" data-pre="${pre}" data-suf="${suf}">${pre}${fmtN(v,d)}${suf?`<small>${suf}</small>`:''}</span>`;
}
function kpi(o){
  const s = o.st || 'nt';
  return `<div class="card kpi s-${s} ${o.cls||''}">
    <div class="kl">${o.label}</div>
    <div class="kv">${num(o.v,o.d||0,o.pre||'',o.suf||'')}</div>
    ${o.spark?`<div class="spark"><canvas id="${o.spark}"></canvas></div>`:''}
    <div class="kf"><span class="meta">${o.meta||''}</span>${s!=='nt'?`<span class="chip">${LBL[s]}</span>`:''}</div>
    ${o.sub?`<div class="ks">${o.sub}</div>`:''}
  </div>`;
}
function countUp(el){
  const v=+el.dataset.v, d=+el.dataset.d, pre=el.dataset.pre, suf=el.dataset.suf, t0=performance.now(), dur=1100;
  (function step(t){
    const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
    el.innerHTML = pre+fmtN(v*e,d)+(suf?`<small>${suf}</small>`:'');
    if(k<1) requestAnimationFrame(step);
  })(t0);
}

const valueLabels = {id:'vl', afterDatasetsDraw(c,a,o){
  if(!o || !o.on) return;
  const ctx=c.ctx, horiz=c.options.indexAxis==='y';
  c.data.datasets.forEach((ds,i)=>{
    const m=c.getDatasetMeta(i); if(m.hidden || ds.noLabel) return;
    m.data.forEach((el,j)=>{
      const v=ds.data[j]; if(v==null) return;
      const t=o.fmt?o.fmt(v):fmtN(v);
      ctx.save(); ctx.font=`700 ${o.size||28}px ${FONT}`; ctx.fillStyle=o.color||C.ink; ctx.strokeStyle='#fff'; ctx.lineWidth=7; ctx.lineJoin='round';
      let x=el.x+12,y=el.y; if(horiz){ctx.textAlign='left';ctx.textBaseline='middle';}
      else{ctx.textAlign='center';ctx.textBaseline='bottom';x=el.x;y=el.y-(c.config.type==='line'?16:8);}
      ctx.strokeText(t,x,y); ctx.fillText(t,x,y);
      ctx.restore();
    });
  });
}};
const centerText = {id:'center', afterDraw(c,a,o){
  if(!o || !o.text) return;
  const {ctx,chartArea:{left,right,top,bottom}}=c, x=(left+right)/2, y=(top+bottom)/2, s=o.size||70;
  ctx.save(); ctx.textAlign='center';
  ctx.font=`700 ${s}px ${FONT}`; ctx.fillStyle=C.g3; ctx.fillText(o.text,x,y+s*.22);
  ctx.font=`700 24px ${FONT}`; ctx.fillStyle=C.mut; ctx.fillText(o.sub||'',x,y+s*.22+34);
  ctx.restore();
}};

function baseOpts(extra={}){

function spark(id,data,color){
  return new Chart(document.getElementById(id),{type:'line',
    data:{labels:data.map((_,i)=>i),datasets:[{data,borderColor:color,borderWidth:4,tension:.35,fill:'start',
      pointRadius:data.map((_,i)=>i===data.length-1?7:0),pointBackgroundColor:color,
      backgroundColor:c=>{const {ctx,chartArea:a}=c.chart; if(!a) return 'transparent';
        const g=ctx.createLinearGradient(0,a.top,0,a.bottom); g.addColorStop(0,color+'55'); g.addColorStop(1,color+'00'); return g;}}]},
    options:baseOpts({animation:{duration:1400,easing:'easeOutCubic'},layout:{padding:{top:10,bottom:2,left:6,right:10}},
      scales:{x:{display:false},y:{display:false,grace:'12%'}}})});
}

/* MERCADO: histórico de referência (passeio aleatório fixo) até a chegada dos dados ao vivo */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function walk(end,n,vol,seed){const r=rng(seed),a=[end];for(let i=1;i<n;i++)a.unshift(a[0]*(1+(r()-.48)*2*vol));return a;}
const MK={};
D.mercado.forEach((m,i)=>{
  m.h = m.k==='selic' ? [10.5,10.5,10.75,11.25,12.25,13.25,14.25,14.25,14.25,14.25,14.25,14.25]
      : walk(m.v, m.pp?12:30, m.vol||.01, 101+i*7);
  m.h[m.h.length-1]=m.v; m.ok=false; MK[m.k]=m;
});
const mVal = m => num(m.v,m.d,m.pre,m.suf);
function mVar(m){
  const h=m.h, dv = m.pp ? h[h.length-1]-h[0] : (h[h.length-1]/h[0]-1)*100;
  if(Math.abs(dv)<0.05) return `<span style="color:${C.mut}">● estável em ${m.per}</span>`;
  const good = m.bom==='baixa' ? dv<0 : dv>0;
  return `<span style="color:${good?C.g2:C.red}">${dv>0?'▲':'▼'} ${fmtN(Math.abs(dv),2)}${m.pp?' p.p.':'%'}</span> <span style="color:${C.mut};font-weight:600">em ${m.per}</span>`;
}

/* ALERTAS do rodapé (gerados a partir dos dados) */
function alertas(){
  const a=[];
  D.estoque.itens.filter(x=>x[1]<7).forEach(x=>a.push(`${x[0]} com cobertura de ${x[1]} dias de estoque`));
  if(D.contratos.v30) a.push(`${D.contratos.v30} contratos vencem nos próximos 30 dias`);
  D.contratos.lista.filter(c=>c.p>=90).forEach(c=>a.push(`Contrato ${c.n} (${c.f}) com ${c.p}% do saldo consumido`));
  D.atrasos.filter(x=>x.d>=7).forEach(x=>a.push(`${x.f}: ${x.m.toLowerCase()} com ${x.d} dias de atraso`));
  F.slice(0,6).filter(f=>notaSt(f.nota)==='cr').forEach(f=>a.push(`${f.n}: nota ${f.nota} com ${fmtN(f.pct,0)}% do gasto da safra`));
  if(R.rcAntigas>M.rcAntigas) a.push(`${R.rcAntigas} RCs sem pedido há mais de 15 dias (meta ≤ ${M.rcAntigas})`);
  if(R.otif<M.otif) a.push(`OTIF do mês em ${fmtN(R.otif,1)}% (meta ${M.otif}%)`);
  if(orcPct>D.orcamento.periodo) a.push(`Orçamento consumido em ${fmtN(orcPct,0)}% com ${D.orcamento.periodo}% do período decorrido`);
  return a;
}

/* =========================================================
   MONTAGEM, RELÓGIO E ROTAÇÃO
   ========================================================= */
const stage=document.getElementById('stage'), main=document.getElementById('main'), menu=document.getElementById('menu');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit); fit();

function relogio(){
  const n=new Date();
  hora.textContent=n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  data.textContent=n.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
}
setInterval(relogio,1000); relogio();
upd.textContent=D.atualizado;

const tt=document.getElementById('tt');
function ticker(){
  const mk=D.mercado.map(m=>{
    const h=m.h, up=h[h.length-1]>=h[0];
    return `<i>${m.n.toUpperCase()}</i>${m.pre}${fmtN(m.v,m.d)}${m.suf} ${up?'▲':'▼'}`;
  });
  tt.innerHTML=[...alertas(),...mk].map(x=>`<span>${x}</span>`).join('<b>●</b>');
  tt.style.animationDuration=Math.max(40,tt.textContent.length*0.17)+'s';
}
ticker();

/* =========================================================
   DADOS AO VIVO (quando o PC da TV tem internet)
   Dólar: AwesomeAPI · Selic, IPCA e IGP-M: Banco Central (SGS)
   Se falhar, a tela continua com os valores de referência.
   ========================================================= */
const getJSON = u => fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok) throw new Error(r.status); return r.json();});
const bcb = (s,n) => getJSON(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${s}/dados/ultimos/${n}?formato=json`).then(a=>a.map(x=>parseFloat(String(x.valor).replace(',','.'))));

function setMk(k,h,v){
  const m=MK[k]; if(!h || !h.length || h.some(isNaN)) return;
  m.h=h; m.v=(v!=null&&!isNaN(v))?v:h[h.length-1]; m.ok=true;
  const mv=document.getElementById('mv-'+k), mx=document.getElementById('mx-'+k), src=document.getElementById('src-'+k);
  if(mv) mv.innerHTML=mVal(m);
  if(mx) mx.innerHTML=mVar(m);
  if(src){src.textContent='● AO VIVO · '+m.fonte; src.classList.add('live');}
  if(m.chart){
    const ds=m.chart.data.datasets[0];
    m.chart.data.labels=h.map((_,i)=>i); ds.data=h; ds.pointRadius=h.map((_,i)=>i===h.length-1?7:0);
    m.chart.update();
  }
  ticker();
}

async function aoVivo(){
  const jobs=[
    getJSON('https://economia.awesomeapi.com.br/json/daily/USD-BRL/30').then(a=>setMk('usd',a.map(x=>+x.bid).reverse())),
    Promise.all([bcb(432,1),bcb(4189,12)]).then(([v,h])=>setMk('selic',h,v[0])),
    bcb(13522,12).then(h=>setMk('ipca',h)),
    bcb(189,20).then(m=>{ // IGP-M mensal → acumulado em 12 meses
      const r=[]; for(let i=11;i<m.length;i++){let p=1;for(let j=i-11;j<=i;j++)p*=1+m[j]/100;r.push((p-1)*100);} setMk('igpm',r);
    })
  ];
  await Promise.allSettled(jobs);
}

let cur=0, t0=performance.now(), paused=false, elapsed=0;

function build(){
  Chart.register(valueLabels,centerText);
  Chart.defaults.font.family=FONT; Chart.defaults.font.size=22; Chart.defaults.font.weight=600;
  Chart.defaults.color=C.mut; Chart.defaults.scale.ticks.maxRotation=0; Chart.defaults.devicePixelRatio=Math.max(2,window.devicePixelRatio||1);
  SCREENS.forEach((s,i)=>{
    s.el=document.createElement('section'); s.el.className='screen'; s.el.style.cssText=s.style; s.el.innerHTML=s.html();
    main.appendChild(s.el);
    const m=document.createElement('div'); m.className='mi'; m.innerHTML=svg(s.icon)+`<span>${s.menu}</span>`;
    m.onclick=()=>show(i); menu.appendChild(m); s.mi=m;
  });
  SCREENS.forEach(s=>{ s.ch = s.charts ? s.charts() : []; });
  const ini=+params.get('tela'); show(ini?ini-1:0);
  requestAnimationFrame(tick);
  aoVivo(); setInterval(aoVivo,10*60*1000); // atualiza o mercado a cada 10 minutos
}

function show(i){
  cur=(i+SCREENS.length)%SCREENS.length;
  SCREENS.forEach((s,j)=>{s.el.classList.toggle('on',j===cur); s.mi.classList.toggle('on',j===cur);});
  const s=SCREENS[cur];
  document.getElementById('htitle').textContent=s.title;
  document.getElementById('hicon').innerHTML=svg(s.icon);
  s.ch.forEach(c=>{c.reset();c.update();});
  s.el.querySelectorAll('.num').forEach(countUp);
  s.el.querySelectorAll('.fill').forEach(f=>{f.style.transition='none';f.style.width='0';void f.offsetWidth;f.style.transition='';f.style.width=f.dataset.w+'%';});
  t0=performance.now(); elapsed=0;
}

function tick(now){
  if(!paused){
    const p=(now-t0)/DUR;
    bar.style.transform=`scaleX(${Math.min(p,1)})`;
    if(p>=1) show(cur+1);
  }
  requestAnimationFrame(tick);
}

addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') show(cur+1);
  else if(e.key==='ArrowLeft') show(cur-1);
  else if(e.code==='Space'){
    e.preventDefault(); paused=!paused; document.body.classList.toggle('paused',paused);
    if(paused) elapsed=performance.now()-t0; else t0=performance.now()-elapsed;
  }
  else if(e.key==='f'||e.key==='F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.();
  }
});

(document.fonts?document.fonts.ready:Promise.resolve()).then(build);
</script>
